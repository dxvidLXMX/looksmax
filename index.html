<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
  <meta name="theme-color" content="#0b0d12"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Looksmax"/>
  <title>Looksmax</title>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"/>
  <link rel="stylesheet" href="./css/styles.css"/>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">Looksmax</div>
      <button id="sync-chip" class="sync-chip local" title="Account & sync">Local</button>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="today">
        <span class="nav-ic">☀️</span><span>Today</span>
      </button>
      <button class="nav-btn" data-tab="body">
        <span class="nav-ic">⚖️</span><span>Body</span>
      </button>
      <button class="nav-btn" data-tab="history">
        <span class="nav-ic">📊</span><span>History</span>
      </button>
      <button class="nav-btn" data-tab="habits">
        <span class="nav-ic">⚙️</span><span>Habits</span>
      </button>
    </nav>

    <div id="modal-back" class="modal-back hidden">
      <div id="modal" class="modal"></div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
